<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deneme Takibi · YKS Hazırlık</title>
  <meta name="description" content="Kaydettiğin YKS denemelerinin net ve puan gelişimi.">
  <style>
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --text: #1c1f2a;
  --muted: #6b7080;
  --primary: #4f46e5;
  --primary-dark: #3730a3;
  --border: #e3e5ee;
  --warn-bg: #fff6e5;
  --warn-text: #8a5a00;
  --radius: 14px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12131a;
    --surface: #1c1e28;
    --text: #eceef5;
    --muted: #9a9fb0;
    --primary: #818cf8;
    --primary-dark: #6366f1;
    --border: #2c2f3d;
    --warn-bg: #2e2614;
    --warn-text: #f0c46c;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.container { max-width: 900px; margin: 0 auto; padding: 0 16px; }

.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}
.logo { font-weight: 800; font-size: 1.25rem; color: var(--text); text-decoration: none; }
.logo span { color: var(--primary); }
nav { display: flex; overflow-x: auto; white-space: nowrap; }
nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-weight: 500; }
nav a.aktif { color: var(--primary); font-weight: 700; }
nav a:hover { color: var(--primary); }

.hero {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  text-align: center;
  padding: 72px 0;
}
.hero h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); margin-bottom: 12px; }
.hero p { opacity: .9; margin-bottom: 24px; }
.hero .btn { background: #fff; color: var(--primary-dark); }

.btn {
  display: inline-block;
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 12px 24px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 1rem;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn-ghost {
  background: transparent;
  color: var(--primary);
  border: 1px solid var(--border);
}

.section { padding: 56px 16px; }
.section h2 { font-size: 1.6rem; margin-bottom: 6px; }
.section h3 { font-size: 1.15rem; margin: 24px 0 10px; }
.muted { color: var(--muted); margin-bottom: 20px; }

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.cd-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: center;
  padding: 20px 8px;
}
.cd-box span {
  display: block;
  font-size: clamp(1.6rem, 6vw, 2.6rem);
  font-weight: 800;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
}
.cd-box small { color: var(--muted); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  overflow-x: auto;
}

.net-table { width: 100%; border-collapse: collapse; }
.net-table th, .net-table td {
  padding: 8px 6px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.net-table th { color: var(--muted); font-weight: 600; font-size: .9rem; }
.net-table td small { color: var(--muted); display: block; font-size: .8rem; }
.net-table .grup td {
  font-size: .8rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
  padding-top: 14px;
}
input[type="number"] {
  width: 64px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-size: 1rem;
}
input.hata { border-color: #e5484d; }
.net-table .net { font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.net-table tfoot td { font-weight: 800; border-bottom: none; }
.net-table tfoot td:last-child { color: var(--primary); font-size: 1.1rem; }

.obp-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: center;
}
.obp-row label { display: flex; align-items: center; gap: 8px; }
.obp-row input[type="number"] { width: 90px; }
.obp-row .muted { margin: 0; font-size: .9rem; }

.actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

.results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.res-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.res-card h4 { font-size: 1rem; margin-bottom: 8px; }
.res-card h4 small { color: var(--muted); font-weight: 500; }
.res-line {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: .92rem;
  padding: 3px 0;
}
.res-line span:first-child { color: var(--muted); }
.res-line b { font-variant-numeric: tabular-nums; }
.res-big {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.res-card .yok { color: var(--muted); font-size: .9rem; }

.note {
  background: var(--warn-bg);
  color: var(--warn-text);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-size: .9rem;
  margin-top: 16px;
}
.sources { font-size: .85rem; color: var(--muted); margin-top: 12px; }
.sources a { color: var(--primary); }

.kaydet-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kaydet-row input[type="text"] {
  flex: 1;
  min-width: 160px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font-size: 1rem;
}
.kaydet-mesaj { color: var(--primary); font-size: .9rem; font-weight: 600; }

.chart-wrap { margin-bottom: 12px; }
.chart-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 14px;
  border-radius: 999px;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
}
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
#grafik { width: 100%; height: auto; display: block; }
#grafik text { fill: var(--muted); font-size: 20px; font-family: inherit; }
#grafik .eksen { stroke: var(--border); }
#grafik .cizgi { stroke: var(--primary); stroke-width: 4; fill: none; }
#grafik .nokta { fill: var(--primary); }
#grafik .etiket { fill: var(--text); font-weight: 700; }
.deneme-table td:last-child { text-align: right; }
.sil {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 1.1rem;
  padding: 2px 6px;
}
.sil:hover { color: #e5484d; }

.filtreler {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  align-items: end;
}
.filtreler label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; }
.filtreler input, .filtreler input[type="number"], .filtreler select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font-size: 1rem;
}
.puan-kaynak { font-size: .85rem; color: var(--muted); margin-top: 8px; }
.prog-liste { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.prog {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.prog-ad { font-weight: 700; }
.prog-uni { font-size: .88rem; }
.prog-fak { font-size: .8rem; color: var(--muted); }
.prog-sag { text-align: right; flex-shrink: 0; }
.prog-puan { font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
.prog-detay { font-size: .8rem; color: var(--muted); }
.prog-detay a { color: var(--primary); }
.rozet {
  display: inline-block;
  font-size: .72rem;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  margin-left: 4px;
  vertical-align: middle;
}
.liste-baslik { display: flex; justify-content: space-between; align-items: baseline; margin-top: 24px; }
.liste-baslik h3 { margin: 0; }
.liste-baslik span { color: var(--muted); font-size: .9rem; }
.daha-fazla { margin-top: 10px; }

.site-footer {
  text-align: center;
  color: var(--muted);
  padding: 32px 0;
  border-top: 1px solid var(--border);
}

@media (max-width: 520px) {
  nav a { margin-left: 10px; font-size: .85rem; }
  .logo span { display: none; }
  .filtreler input[type="number"] { width: 100%; }
  .logo { font-size: 1.05rem; }
  .prog { flex-direction: column; gap: 4px; }
  .prog-sag { text-align: left; }
  .countdown { gap: 8px; }
  input[type="number"] { width: 52px; }
  .net-table th, .net-table td { padding: 8px 4px; }
}
  
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">YKS<span>Hazırlık</span></a>
      <nav>
        <a href="index.html#hesapla">Hesapla</a>
        <a href="index.html#tercih">Tercih</a>
        <a href="denemeler.html" class="aktif">Denemeler</a>
        <a href="program.html">Program</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container section">
      <h2>Deneme Takibi</h2>
      <p class="muted">Kaydettiğin denemeler sadece bu cihazdaki tarayıcında saklanır. Başka cihazda görünmez, tarayıcı verilerini silersen kaybolur.</p>
      <div id="deneme-icerik"></div>
      <div class="actions"><a class="btn" href="index.html#hesapla">Yeni deneme ekle</a></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>YKS Hazırlık · Başarılar! 🎯</p>
    </div>
  </footer>

  <script>
const DEPO_ANAHTAR = "yks-denemeler";

function iki(n) {
  return n.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const GRAFIK_TURLERI = [
  { kod: "tytNet", ad: "TYT Net" },
  { kod: "aytNet", ad: "AYT Net" },
  { kod: "TYT", ad: "TYT Puan" },
  { kod: "SAY", ad: "SAY" },
  { kod: "EA", ad: "EA" },
  { kod: "SOZ", ad: "SÖZ" },
];
let grafikTuru = "tytNet";

function denemeleriOku() {
  try {
    const veri = JSON.parse(localStorage.getItem(DEPO_ANAHTAR));
    return Array.isArray(veri) ? veri : [];
  } catch (e) {
    return [];
  }
}

function denemeleriYaz(liste) {
  try {
    localStorage.setItem(DEPO_ANAHTAR, JSON.stringify(liste));
    return true;
  } catch (e) {
    return false;
  }
}

function kacis(metin) {
  const div = document.createElement("div");
  div.textContent = metin;
  return div.innerHTML;
}

function denemeDegeri(d, kod) {
  if (kod === "tytNet" || kod === "aytNet") return d[kod];
  return d.puanlar ? d.puanlar[kod] : undefined;
}

function grafikCiz(liste) {
  const noktalar = liste
    .map((d, i) => ({ i, d, v: denemeDegeri(d, grafikTuru) }))
    .filter((p) => typeof p.v === "number");
  if (noktalar.length === 0) return `<p class="muted">Bu tür için kayıtlı değer yok.</p>`;

  const G = 600, Y = 300, sol = 56, sag = 30, ust = 40, alt = 40;
  const degerler = noktalar.map((p) => p.v);
  let min = Math.min(...degerler), max = Math.max(...degerler);
  if (min === max) { min -= 5; max += 5; }
  const pay = (max - min) * 0.1;
  min -= pay; max += pay;
  const x = (k) => noktalar.length === 1 ? (sol + G - sag) / 2 : sol + (k / (noktalar.length - 1)) * (G - sol - sag);
  const y = (v) => ust + (1 - (v - min) / (max - min)) * (Y - ust - alt);

  let svg = `<svg id="grafik" viewBox="0 0 ${G} ${Y}" role="img" aria-label="Deneme gelişim grafiği">`;
  for (let k = 0; k <= 3; k++) {
    const v = min + (k / 3) * (max - min);
    svg += `<line class="eksen" x1="${sol}" x2="${G - sag}" y1="${y(v)}" y2="${y(v)}"/>`;
    svg += `<text x="${sol - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
  }
  svg += `<polyline class="cizgi" points="${noktalar.map((p, k) => `${x(k)},${y(p.v)}`).join(" ")}"/>`;
  noktalar.forEach((p, k) => {
    svg += `<circle class="nokta" cx="${x(k)}" cy="${y(p.v)}" r="7"><title>${kacis(p.d.ad)}: ${iki(p.v)}</title></circle>`;
    svg += `<text x="${x(k)}" y="${Y - 8}" text-anchor="middle">${k + 1}</text>`;
  });
  const son = noktalar[noktalar.length - 1];
  svg += `<text class="etiket" x="${x(noktalar.length - 1)}" y="${y(son.v) - 16}" text-anchor="middle">${iki(son.v)}</text>`;
  return svg + `</svg>`;
}

function denemeleriCiz() {
  const kutu = document.getElementById("deneme-icerik");
  const liste = denemeleriOku();
  if (liste.length === 0) {
    kutu.innerHTML = `<div class="card"><p class="muted" style="margin:0">Henüz kayıtlı deneme yok. <a href=\"index.html#hesapla\">Hesaplayıcıda</a> netlerini girip "Kaydet"e bas.</p></div>`;
    return;
  }

  const sekmeler = GRAFIK_TURLERI.map((t) =>
    `<button class="chip${t.kod === grafikTuru ? " active" : ""}" data-tur="${t.kod}">${t.ad}</button>`).join("");

  const satirlar = liste.map((d, i) => `
    <tr>
      <td>${i + 1}. ${kacis(d.ad)}<small>${new Date(d.tarih).toLocaleDateString("tr-TR")}</small></td>
      <td>${iki(d.tytNet)}</td>
      <td>${iki(d.aytNet)}</td>
      <td><button class="sil" data-sil="${i}" aria-label="Sil">×</button></td>
    </tr>`).reverse().join("");

  kutu.innerHTML = `
    <div class="card chart-wrap">
      <div class="chart-tabs">${sekmeler}</div>
      ${grafikCiz(liste)}
    </div>
    <div class="card">
      <table class="net-table deneme-table">
        <thead><tr><th>Deneme</th><th>TYT Net</th><th>AYT Net</th><th></th></tr></thead>
        <tbody>${satirlar}</tbody>
      </table>
    </div>`;
}

document.getElementById("deneme-icerik").addEventListener("click", (e) => {
  const tur = e.target.dataset.tur;
  const sil = e.target.dataset.sil;
  if (tur) {
    grafikTuru = tur;
    denemeleriCiz();
  } else if (sil !== undefined) {
    const liste = denemeleriOku();
    liste.splice(Number(sil), 1);
    denemeleriYaz(liste);
    denemeleriCiz();
  }
});

denemeleriCiz();


  </script>
</body>
</html>
